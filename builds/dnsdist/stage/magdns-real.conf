# real NextDNS upstream chain (mobile-network friendly: only a handful of queries)
listen_dot = [::]:1853
listen_doq = [::]:18853
cert_file = certs/sut.pem
key_file = certs/sut.key
upstream = quic://88f745.dns.nextdns.io:853
upstream = tls://88f745.dns.nextdns.io:853
upstream = https://dns.nextdns.io/88f745
allow_private_upstream = false
cache_bytes = 10485760
cache_ttl = 1200
query_timeout_ms = 12000
attempt_timeout_ms = 3000
probe_interval_s = 10
log_queries = false
