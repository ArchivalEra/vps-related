# DoH-only real chain (this mobile network blackholes TCP/UDP 853 outbound)
listen_dot = [::]:1853
listen_doq = [::]:18853
cert_file = certs/sut.pem
key_file = certs/sut.key
upstream = https://dns.nextdns.io/88f745
allow_private_upstream = false
cache_bytes = 10485760
cache_ttl = 1200
query_timeout_ms = 16000
attempt_timeout_ms = 10000
probe_interval_s = 10
log_queries = false
