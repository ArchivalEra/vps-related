# PGO workload config: same shape as the real thing but with an 8MB magazine
# (to exercise eviction within 30min) and quieter logging.
listen_dot = [::]:1853
listen_doq = [::]:18853
cert_file = certs/sut.pem
key_file = certs/sut.key
extra_ca = certs/ca.pem
upstream = quic://127.0.0.1:1854
upstream = tls://127.0.0.1:1855
upstream = https://127.0.0.1:1856/dns-query
allow_private_upstream = true
cache_bytes = 8388608
cache_ttl = 1200
query_timeout_ms = 2500
attempt_timeout_ms = 1200
probe_interval_s = 5
log_queries = false
