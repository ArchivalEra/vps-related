# box-shaped config: udp:// upstream only (clash dns leg), small magazine for tests
listen_dot = [::]:1853
listen_doq = [::]:18853
cert_file = certs/sut.pem
key_file = certs/sut.key
upstream = udp://127.0.0.1:15301
allow_private_upstream = true
cache_bytes = 2097152
cache_ttl = 1200
cache_ttl_ignore = false
query_timeout_ms = 3000
attempt_timeout_ms = 1500
probe_interval_s = 3
log_queries = false
