[package]
name = "magdns"
version = "0.1.0"
edition = "2021"
description = "Private DoT/DoQ relay: magazine-style in-memory cache, ordered upstream fallback (quic:// tls:// https://)"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "io-util", "signal", "sync"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std", "log"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
socket2 = "0.5"
hyper = { version = "1", default-features = false, features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "tokio", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "http2", "logging", "tls12", "webpki-tokio"] }
http = "1"
http-body-util = "0.1"
bytes = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
