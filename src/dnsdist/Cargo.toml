[package]
name = "magdns"
version = "0.2.0"
edition = "2021"
description = "Private DoT/DoQ relay: magazine-style in-memory cache, ordered upstream fallback (quic:// tls:// https:// udp://)"
license = "MIT"

[features]
default = ["up-tls", "up-quic", "up-doh", "up-udp"]
# upstream transports; listeners (DoT/DoQ) are always built
up-tls = []
up-quic = []
up-doh = ["dep:hyper", "dep:hyper-util", "dep:http", "dep:http-body-util", "dep:bytes", "dep:tower-service", "dep:hyper-rustls", "dep:flate2"]
up-udp = []

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "io-util", "signal", "sync"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std", "log"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
socket2 = "0.5"
ring = "0.17"
hyper = { version = "1", default-features = false, optional = true, features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, optional = true, features = ["ring", "http1", "http2", "logging", "tls12", "webpki-tokio"] }
hyper-util = { version = "0.1", default-features = false, optional = true, features = ["client-legacy", "tokio", "http1", "http2"] }
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
tower-service = { version = "0.3", optional = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
